<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Let's Learn Together</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    max-width:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f7ff;
    color:#172033;
    transition:.3s;
}

body.dark{
    background:#0b1220;
    color:white;
}

/* الرأس */

header{
    width:calc(100% - 20px);
    margin:10px auto;
    padding:32px 15px;
    border-radius:22px;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#0878e8,#123caa);
    box-shadow:0 7px 20px #0003;
}

header h1{
    margin:0;
    font-size:clamp(25px,7vw,36px);
}

header p{
    margin:10px 0 0;
    font-size:clamp(15px,4.5vw,19px);
}

/* القائمة */

.menu{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:white;
    color:#0878e8;
    font-size:25px;
    box-shadow:0 3px 12px #0004;
}

.dark .menu{
    background:#1e293b;
    color:white;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:800;
    background:#0008;
    display:none;
}

.overlay.show{
    display:block;
}

.side{
    position:fixed;
    top:0;
    right:-310px;
    z-index:900;
    width:min(300px,85vw);
    height:100vh;
    padding:75px 18px 20px;
    background:white;
    box-shadow:-5px 0 20px #0005;
    transition:.3s;
}

.side.show{
    right:0;
}

.dark .side{
    background:#172236;
}

.side h2{
    margin-top:0;
}

.side button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:0;
    border-radius:12px;
    background:#eaf2ff;
    font-size:15px;
    text-align:right;
}

.dark .side button{
    background:#26364e;
    color:white;
}

.whatsapp{
    background:#16a34a!important;
    color:white!important;
}

/* المحتوى */

.container{
    width:calc(100% - 20px);
    max-width:850px;
    margin:20px auto;
}

.subtitle{
    text-align:center;
    font-size:clamp(20px,6vw,27px);
    margin:25px 0 18px;
}

/* البطاقات */

.card{
    width:100%;
    margin:12px 0;
    overflow:hidden;
    border-radius:17px;
    background:white;
    box-shadow:0 4px 15px #0002;
}

.dark .card{
    background:#1e293b;
}

.card-title{
    width:100%;
    padding:20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:clamp(15px,4.5vw,18px);
    font-weight:bold;
    cursor:pointer;
}

.card-title span:first-child{
    min-width:0;
}

.arrow{
    flex-shrink:0;
    transition:.3s;
}

.card.open .arrow{
    transform:rotate(180deg);
}

.card-buttons{
    display:none;
    gap:8px;
    padding:0 12px 14px;
}

.card.open .card-buttons{
    display:flex;
}

.card-buttons button{
    flex:1;
    min-width:0;
    padding:13px 5px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:14px;
}

.lesson-btn{
    background:#0878e8;
}

.exercise-btn{
    background:#16a34a;
}

/* الصفحات */

.page{
    display:none;
}

.page.active{
    display:block;
}

.back{
    margin-bottom:12px;
    padding:11px 18px;
    border:0;
    border-radius:10px;
    background:#64748b;
    color:white;
}

/* الدرس */

.lesson{
    width:100%;
    padding:20px 16px;
    border-radius:18px;
    background:white;
    box-shadow:0 4px 18px #0002;
    line-height:1.9;
}

.dark .lesson{
    background:#1e293b;
}

.lesson h2{
    margin-top:0;
    color:#0878e8;
    font-size:clamp(22px,6vw,30px);
}

.lesson h3{
    margin-top:30px;
    color:#0878e8;
    font-size:clamp(18px,5vw,23px);
}

.lesson p{
    margin:13px 0;
    font-size:clamp(16px,4.4vw,18px);
}

.hero{
    width:100%;
    padding:25px 10px;
    margin-bottom:20px;
    border-radius:18px;
    text-align:center;
    font-size:65px;
    background:#e8f3ff;
}

.dark .hero{
    background:#26364e;
}

.tip{
    margin:25px 0;
    padding:15px;
    border-right:5px solid #0878e8;
    border-radius:10px;
    background:#edf6ff;
}

.dark .tip{
    background:#26364e;
}

/* الاختبار */

.quiz{
    width:100%;
    padding:20px 15px;
    border-radius:18px;
    background:white;
    box-shadow:0 4px 18px #0002;
}

.dark .quiz{
    background:#1e293b;
}

.quiz h2{
    font-size:clamp(20px,6vw,27px);
}

.quiz h3{
    line-height:1.6;
    font-size:clamp(17px,4.8vw,21px);
}

.progress{
    height:9px;
    margin:18px 0;
    border-radius:10px;
    overflow:hidden;
    background:#ddd;
}

.progress-bar{
    height:100%;
    width:0;
    background:#0878e8;
}

.option{
    width:100%;
    margin:6px 0;
    padding:14px 10px;
    border:2px solid #d9e1ec;
    border-radius:11px;
    background:white;
    text-align:right;
    font-size:15px;
    line-height:1.5;
}

.dark .option{
    background:#26364e;
    color:white;
    border-color:#475569;
}

.option.correct{
    background:#dcfce7!important;
    border-color:#22c55e!important;
    color:#166534!important;
}

.option.wrong{
    background:#fee2e2!important;
    border-color:#ef4444!important;
    color:#991b1b!important;
}

.feedback{
    display:none;
    margin-top:12px;
    padding:13px;
    border-radius:10px;
    text-align:center;
}

.feedback.good{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.feedback.bad{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.next{
    display:none;
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0878e8;
    color:white;
    font-size:16px;
}

/* النتيجة */

.result{
    padding:25px 15px;
    border-radius:18px;
    background:white;
    text-align:center;
    box-shadow:0 4px 18px #0002;
}

.dark .result{
    background:#1e293b;
}

.score{
    font-size:60px;
    font-weight:bold;
    color:#0878e8;
}

.stat{
    margin:9px 0;
    padding:13px;
    border-radius:10px;
    background:#edf5ff;
}

.dark .stat{
    background:#26364e;
}

.home-btn{
    padding:13px 22px;
    border:0;
    border-radius:10px;
    background:#0878e8;
    color:white;
    font-size:15px;
}

footer{
    padding:30px 10px;
    text-align:center;
    opacity:.6;
}

/* الهاتف الصغير */

@media(max-width:380px){

    .container{
        width:calc(100% - 14px);
    }

    header{
        width:calc(100% - 14px);
    }

    .card-title{
        padding:17px 12px;
    }

    .lesson{
        padding:17px 13px;
    }

    .quiz{
        padding:17px 12px;
    }
}
</style>
</head>

<body>

<button class="menu" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<aside class="side" id="side">

<h2>⚙️ القائمة</h2>

<button onclick="toggleDark()">
🌙 الوضع الليلي / ☀️ النهاري
</button>

<button class="whatsapp" onclick="contactDeveloper()">
📱 التواصل معنا عبر واتساب
</button>

</aside>


<!-- الرئيسية -->

<section class="page active" id="home">

<header>
<h1>Let's Learn Together</h1>
<p>🚀 تعلم البرمجة من الصفر حتى الاحتراف</p>
</header>

<div class="container">

<h2 class="subtitle">
📚 اختر درسًا وابدأ التعلم
</h2>

<div id="cards"></div>

</div>

<footer>
Let's Learn Together © 2026
</footer>

</section>


<!-- الدرس -->

<section class="page" id="lessonPage">

<div class="container">

<button class="back" onclick="goHome()">
← العودة للدروس
</button>

<article class="lesson">

<h2 id="lessonTitle"></h2>

<div id="lessonContent"></div>

</article>

</div>

</section>


<!-- الاختبار -->

<section class="page" id="quizPage">

<div class="container">

<button class="back" onclick="goHome()">
← العودة للدروس
</button>

<div class="quiz">

<h2 id="quizTitle"></h2>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<p id="questionNumber"></p>

<h3 id="question"></h3>

<div id="options"></div>

<div id="feedback" class="feedback"></div>

<button class="next" id="nextButton" onclick="nextQuestion()">
السؤال التالي →
</button>

</div>
</div>

</section>


<!-- النتيجة -->

<section class="page" id="resultPage">

<div class="container">

<div class="result">

<h1>🎉 أحسنت!</h1>

<div class="score" id="score">0%</div>

<div class="stat" id="correctStat"></div>

<div class="stat" id="wrongStat"></div>

<div class="stat" id="percentStat"></div>

<button class="home-btn" onclick="goHome()">
🏠 العودة للدروس
</button>

</div>

</div>

</section>


<script>

/* =========================
   الدروس
========================= */

const lessons = [

{
title:"ما هي البرمجة؟",
icon:"💻",
description:"تعلم أساسيات البرمجة وكيف يفكر المبرمج.",
sections:[
["ما هي البرمجة؟",
"البرمجة هي طريقة نعطي بها الحاسوب تعليمات واضحة حتى ينفذ مهمة معينة. الحاسوب لا يستطيع معرفة ما نريده من تلقاء نفسه، لذلك نكتب له مجموعة من الأوامر المنظمة. عندما تفتح تطبيقًا أو لعبة أو موقعًا، فهناك برنامج يعمل في الخلفية ويحدد كيف يتصرف هذا النظام."],

["كيف يفكر المبرمج؟",
"المبرمج الجيد لا يبدأ بكتابة الكود بشكل عشوائي. يبدأ أولًا بفهم المشكلة، ثم يبحث عن المعلومات المطلوبة، وبعد ذلك يقسم المشكلة الكبيرة إلى أجزاء صغيرة. عندما تصبح الخطوات واضحة، يبدأ بتحويلها إلى تعليمات يفهمها الحاسوب."],

["الخوارزميات",
"الخوارزمية هي مجموعة خطوات مرتبة لحل مشكلة. مثلًا إذا أردنا حساب متوسط ثلاثة أرقام، نحتاج إلى معرفة الأرقام، جمعها، ثم تقسيم الناتج على ثلاثة. هذه الخطوات يمكن تحويلها لاحقًا إلى كود."],

["لماذا نتعلم البرمجة؟",
"البرمجة لا تعني فقط كتابة الأكواد. إنها تساعدك على التفكير بطريقة منظمة وحل المشكلات. يمكنك استخدامها لبناء المواقع والتطبيقات والألعاب والأدوات التعليمية وغيرها من المشاريع. وكلما مارست أكثر أصبحت قادرًا على بناء مشاريع أكبر."],

["أهم شيء للمبتدئ",
"لا تحاول حفظ كل شيء. افهم الفكرة وجربها بنفسك. إذا ظهر خطأ فلا تتوقف؛ حاول قراءة الخطأ ومعرفة السبب. المبرمجون يواجهون الأخطاء باستمرار، والتعلم الحقيقي يحدث عندما تحاول إصلاحها."]
]
},

{
title:"HTML وبناء صفحات الويب",
icon:"🌐",
description:"تعلم كيف تبني الهيكل الأساسي لأي صفحة ويب.",
sections:[
["ما هي HTML؟",
"HTML هي اللغة المستخدمة لبناء هيكل صفحات الويب. باستخدامها نستطيع إضافة العناوين والفقرات والصور والروابط والقوائم والأزرار وغيرها من العناصر التي تظهر داخل الصفحة."],

["العناوين والفقرات",
"يمكن استخدام h1 للعنوان الرئيسي، ثم h2 وh3 للعناوين الفرعية. أما p فتستخدم لكتابة الفقرات. تنظيم الصفحة بالعناوين يجعل المحتوى أسهل للقراءة والفهم."],

["الروابط والصور",
"يمكن إضافة رابط باستخدام العنصر a، ويمكن إضافة صورة باستخدام img. عند إنشاء موقع حقيقي من المهم التأكد من أن الصور مناسبة وأن الروابط تعمل بشكل صحيح."],

["الأزرار",
"العنصر button يسمح بإنشاء زر يمكن للمستخدم الضغط عليه. HTML وحدها تنشئ العنصر، بينما يمكن استخدام JavaScript لجعل الزر ينفذ عملية معينة عند الضغط عليه."],

["هيكل الصفحة",
"صفحة HTML عادة تحتوي على head وbody. داخل head توجد معلومات الصفحة مثل العنوان وبعض الإعدادات، بينما يحتوي body على العناصر التي يراها الزائر."]
]
},

{
title:"CSS وتصميم المواقع",
icon:"🎨",
description:"تعلم كيف تجعل موقعك جميلًا ومتناسقًا.",
sections:[
["ما هي CSS؟",
"CSS هي اللغة التي تتحكم في شكل عناصر HTML. تستطيع من خلالها تغيير الألوان والخطوط والمسافات والحواف وأحجام العناصر وترتيبها."],

["الألوان والخطوط",
"يمكن تغيير لون النص والخلفية باستخدام خصائص CSS. كما يمكن تغيير حجم الخط وجعله عريضًا أو التحكم في نوع الخط المستخدم."],

["margin و padding",
"margin هي المساحة الموجودة خارج العنصر، بينما padding هي المساحة الموجودة بين محتوى العنصر وحدوده. فهم الفرق بينهما مهم جدًا عند تصميم الصفحات."],

["Flexbox",
"Flexbox تساعد على ترتيب العناصر بسهولة في صف أو عمود. وهي مفيدة جدًا لإنشاء قوائم وأزرار وتصميمات تتكيف مع الشاشات المختلفة."],

["الهاتف والشاشات الصغيرة",
"يجب أن يكون الموقع مناسبًا للهاتف. يمكن استخدام Media Queries لتغيير أحجام العناصر وترتيبها حسب عرض الشاشة. الموقع الجيد لا يجبر المستخدم على التكبير أو السحب يمينًا ويسارًا."]
]
},

{
title:"JavaScript والتفاعل",
icon:"⚡",
description:"تعلم كيف تجعل الموقع يتفاعل مع المستخدم.",
sections:[
["ما هي JavaScript؟",
"JavaScript لغة برمجة تستخدم لإضافة المنطق والتفاعل إلى صفحات الويب. يمكنها تغيير محتوى الصفحة والاستجابة للضغط على الأزرار وإجراء الحسابات والتعامل مع البيانات."],

["الأحداث",
"الحدث هو شيء يحدث داخل الصفحة، مثل الضغط على زر أو الكتابة داخل مربع. يمكن لـJavaScript اكتشاف هذه الأحداث وتنفيذ تعليمات عند حدوثها."],

["تغيير الصفحة",
"يمكن لـJavaScript الوصول إلى عناصر HTML وتغيير النصوص أو الأصناف أو الخصائص. بهذه الطريقة يمكن إنشاء صفحات تفاعلية بدل صفحات ثابتة."],

["الحسابات",
"يمكن استخدام JavaScript لإجراء العمليات الحسابية مثل الجمع والطرح والضرب والقسمة. وهذا يسمح ببناء أدوات مثل الآلات الحاسبة."],

["الممارسة",
"أفضل طريقة لتعلم JavaScript هي كتابة مشاريع صغيرة. ابدأ بزر يغير نصًا، ثم جرب عدادًا، وبعد ذلك آلة حاسبة أو اختبارًا بسيطًا."]
]
},

{
title:"المتغيرات والبيانات",
icon:"📦",
description:"تعلم كيف يخزن البرنامج المعلومات.",
sections:[
["المتغيرات",
"المتغير هو مكان في البرنامج نضع فيه قيمة. يمكن أن تكون القيمة اسمًا أو رقمًا أو نتيجة عملية. المتغيرات تجعل البرامج قادرة على التعامل مع المعلومات."],

["النصوص",
"النص يسمى String. يمكن أن يكون اسم شخص أو جملة أو كلمة. يمكن للبرنامج تخزين النصوص واستخدامها وعرضها للمستخدم."],

["الأرقام",
"الأرقام تستخدم في الحسابات والمقارنات. يمكن للبرنامج جمع الأرقام وطرحها وضربها وقسمتها."],

["Boolean",
"القيمة المنطقية Boolean لها حالتان أساسيتان: true وfalse. تستخدم كثيرًا في الشروط لمعرفة هل شيء صحيح أم غير صحيح."],

["اختيار أسماء واضحة",
"من الأفضل اختيار أسماء مفهومة للمتغيرات. عندما تعود إلى الكود بعد أيام ستجد أن الأسماء الواضحة تجعل فهم البرنامج أسهل بكثير."]
]
},

{
title:"الشروط واتخاذ القرار",
icon:"🔀",
description:"تعلم كيف تجعل البرنامج يتخذ قرارات.",
sections:[
["if",
"if تسمح للبرنامج بفحص شرط معين. إذا كان الشرط صحيحًا ينفذ البرنامج مجموعة معينة من التعليمات."],

["else",
"else تستخدم عندما لا يتحقق الشرط. يمكن بذلك إنشاء مسارين مختلفين حسب حالة المستخدم أو البيانات."],

["المقارنات",
"يمكن مقارنة الأرقام والقيم باستخدام معاملات مختلفة. مثلًا يمكن معرفة هل رقم أكبر من رقم آخر أو هل قيمتان متساويتان."],

["أكثر من شرط",
"في بعض البرامج نحتاج إلى فحص عدة حالات. يمكن استخدام else if لإنشاء شروط متتابعة."],

["أمثلة عملية",
"يمكن استخدام الشروط لمعرفة نتيجة طالب، أو تحديد رسالة مناسبة للمستخدم، أو معرفة هل يستطيع المستخدم تنفيذ عملية معينة."]
]
},

{
title:"الحلقات التكرارية",
icon:"🔁",
description:"تعلم تكرار الأوامر بطريقة ذكية.",
sections:[
["لماذا الحلقات؟",
"إذا أردت تنفيذ نفس الأمر عشرات المرات، سيكون من السيئ كتابة الأمر نفسه عشرات المرات. الحلقات تسمح للبرنامج بتكرار التعليمات تلقائيًا."],

["حلقة for",
"for تستخدم كثيرًا عندما نريد تكرار عملية عددًا محددًا من المرات. يجب الانتباه إلى شرط التوقف حتى لا يستمر التكرار بلا نهاية."],

["حلقة while",

const cards=document.getElementById("cards");

lessons.forEach((lesson,index)=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`
        <div class="card-title" onclick="toggleCard(this)">
            <span>${lesson.icon} ${index+1}. ${lesson.title}</span>
            <span class="arrow">▼</span>
        </div>

        <div class="card-buttons">

            <button class="lesson-btn"
            onclick="openLesson(${index})">
            📖 الدرس
            </button>

            <button class="exercise-btn"
            onclick="openQuiz(${index})">
            📝 التمرين
            </button>

        </div>
    `;

    cards.appendChild(card);
});


function toggleCard(element){
    element.parentElement.classList.toggle("open");
}


/* =========================
   فتح الدرس
========================= */

function openLesson(index){

    const lesson=lessons[index];

    document.getElementById("lessonTitle").textContent=
        lesson.icon+" "+lesson.title;

    let html=`
        <div class="hero">${lesson.icon}</div>

        <p><strong>${lesson.description}</strong></p>
    `;

    lesson.sections.forEach(section=>{

        html+=`
            <h3>📌 ${section[0]}</h3>
            <p>${section[1]}</p>
        `;

    });

    html+=`
        <div class="tip">
        💡 <strong>نصيحة:</strong>
        لا تكتفِ بقراءة الدرس. افتح Acode وجرب بنفسك.
        عندما يظهر خطأ، حاول فهمه وإصلاحه.
        </div>

        <h3>🚀 بعد الدرس</h3>

        <p>
        عندما تنتهي من القراءة، انتقل إلى التمرين
        واختبر فهمك للموضوع.
        </p>
    `;

    document.getElementById("lessonContent").innerHTML=html;

    showPage("lessonPage");
}


/* =========================
   الأسئلة
========================= */

let questions=[];
let current=0;
let correct=0;
let wrong=0;
let answered=false;

function createQuestions(index){

    const facts=[];

    lessons[index].sections.forEach(section=>{
        facts.push(section[1]);
    });

    const result=[];

    for(let i=0;i<30;i++){

        const correctAnswer=facts[i%facts.length];

        let options=[correctAnswer];

        for(let j=1;j<facts.length && options.length<5;j++){

            options.push(
                facts[(i+j)%facts.length]
            );

        }

        while(options.length<5){
            options.push(
                "هذه المعلومة لا تتعلق بهذا الجزء من الدرس."
            );
        }

        options=options.sort(()=>Math.random()-0.5);

        result.push({
            question:
            "أي معلومة صحيحة تتعلق بدرس «"+
            lessons[index].title+"»؟",

            options:options,

            answer:options.indexOf(correctAnswer)
        });
    }

    return result;
}


/* =========================
   فتح الاختبار
========================= */

function openQuiz(index){

    questions=createQuestions(index);

    current=0;
    correct=0;
    wrong=0;

    document.getElementById("quizTitle").textContent=
        "📝 اختبار: "+lessons[index].title;

    showPage("quizPage");

    showQuestion();
}


/* =========================
   السؤال
========================= */

function showQuestion(){

    answered=false;

    const q=questions[current];

    document.getElementById("questionNumber").textContent=
        "السؤال "+(current+1)+" من 30";

    document.getElementById("question").textContent=
        q.question;

    document.getElementById("progressBar").style.width=
        ((current/30)*100)+"%";

    const options=document.getElementById("options");

    options.innerHTML="";

    q.options.forEach((answer,index)=>{

        const button=document.createElement("button");

        button.className="option";

        button.textContent=
            String.fromCharCode(65+index)+" — "+answer;

        button.onclick=()=>{
            checkAnswer(index,button);
        };

        options.appendChild(button);

    });

    const feedback=document.getElementById("feedback");

    feedback.className="feedback";
    feedback.textContent="";

    document.getElementById("nextButton")
    .style.display="none";
}


/* =========================
   التحقق
========================= */

function checkAnswer(index,button){

    if(answered)return;

    answered=true;

    const q=questions[current];

    const buttons=
        document.querySelectorAll(".option");

    buttons.forEach(b=>{
        b.disabled=true;
    });

    if(index===q.answer){

        correct++;

        button.classList.add("correct");

        const feedback=
            document.getElementById("feedback");

        feedback.className="feedback good";

        feedback.textContent=
            "🟢 إجابة صحيحة! أحسنت.";

    }else{

        wrong++;

        button.classList.add("wrong");

        buttons[q.answer].classList.add("correct");

        const feedback=
            document.getElementById("feedback");

        feedback.className="feedback bad";

        feedback.textContent=
            "🔴 إجابة خاطئة. الإجابة الصحيحة باللون الأخضر.";
    }

    document.getElementById("nextButton")
    .style.display="block";
}


/* =========================
   التالي
========================= */

function nextQuestion(){

    current++;

    if(current>=30){

        showResult();

    }else{

        showQuestion();

    }
}


/* =========================
   النتيجة
========================= */

function showResult(){

    const percentage=
        Math.round((correct/30)*100);

    document.getElementById("score").textContent=
        percentage+"%";

    document.getElementById("correctStat").textContent=
        "✅ الإجابات الصحيحة: "+correct;

    document.getElementById("wrongStat").textContent=
        "❌ الأخطاء: "+wrong;

    document.getElementById("percentStat").textContent=
        "📊 النتيجة: "+correct+" من 30";

    showPage("resultPage");
}


/* =========================
   الصفحات
========================= */

function showPage(id){

    document.querySelectorAll(".page")
    .forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id)
    .classList.add("active");

    window.scrollTo(0,0);
}


function goHome(){
    showPage("home");
}
